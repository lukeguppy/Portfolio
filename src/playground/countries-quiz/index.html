  <style>
    /* Critical Mobile Keyboard Safety: guarantee input is NEVER covered by keyboard */
    @media (max-width: 600px) {
      #game-controls {
        transition: top 0.25s cubic-bezier(0.16, 1, 0.3, 1), bottom 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s ease, opacity 0.2s ease;
      }
      html.keyboard-open #game-controls,
      #game-controls.keyboard-active,
      #game-controls:focus-within {
        position: fixed !important;
        top: max(100px, calc(env(safe-area-inset-top, 8px) + 90px)) !important;
        bottom: auto !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: calc(100vw - 20px) !important;
        max-width: 380px !important;
        z-index: 3500 !important;
        gap: 0 !important;
      }
      html.keyboard-open #lives-container,
      #game-controls.keyboard-active #lives-container,
      #game-controls:focus-within #lives-container {
        display: none !important;
      }
      html.keyboard-open .control-panel,
      #game-controls.keyboard-active .control-panel,
      #game-controls:focus-within .control-panel {
        display: flex !important;
        flex-direction: row !important;
        align-items: center !important;
        padding: 6px 8px !important;
        gap: 6px !important;
        background: rgba(15, 23, 42, 0.95) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border: 1px solid rgba(56, 189, 248, 0.4) !important;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7) !important;
      }
      html.keyboard-open #guess-input,
      #game-controls.keyboard-active #guess-input,
      #game-controls:focus-within #guess-input {
        flex: 1 1 auto !important;
        min-width: 0 !important;
        font-size: 16px !important; /* Prevents iOS auto-zoom */
        padding: 8px 12px !important;
        height: 42px !important;
        text-align: left !important;
        border-radius: 10px !important;
      }
      html.keyboard-open .button-group,
      #game-controls.keyboard-active .button-group,
      #game-controls:focus-within .button-group {
        display: flex !important;
        flex: 0 0 auto !important;
        gap: 5px !important;
      }
      html.keyboard-open .button-group button,
      #game-controls.keyboard-active .button-group button,
      #game-controls:focus-within .button-group button {
        padding: 0 10px !important;
        height: 42px !important;
        font-size: 0.85rem !important;
        border-radius: 10px !important;
        flex: 0 0 auto !important;
      }
      .feedback-popup {
        top: max(156px, calc(env(safe-area-inset-top, 8px) + 148px)) !important;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="nav-buttons">

      </a>
      <a href="../" class="nav-btn" title="Back to Playground">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">

          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>

    </div>
    <canvas id="globe-canvas"></canvas>

    <!-- Top Bar: Timer and Score -->
    <div id="top-bar" class="ui-panel hidden">
      <div class="stat-group">

      <div class="stat-group">

    <!-- Start Screen Overlay -->

        <div class="settings-group">

              </svg>
              <svg class="heart-btn filled" data-val="3" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path
                  d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />

    <!-- Feedback Overlay (Center) -->

        </svg>
        <!-- SVG Heart 2 -->
        <svg class="life-heart" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>
        <!-- SVG Heart 3 -->
        <svg class="life-heart" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path

          <button id="skip-btn" class="secondary-btn">Skip</button>
          <button id="pass-btn" class="danger-btn">Pass</button>
        </div>
      </div>
    </div>

    <!-- End Screen Overlay -->
    <div id="end-overlay" class="overlay hidden">
      <div class="card">
        <h2>Quiz Complete!</h2>
        <div class="final-score">
          <span id="final-score-val">0</span>
          <span class="sub-text">Correct</span>
        </div>
        <p id="final-time-text">Time: 00:00</p>
        <button id="restart-btn" class="primary-btn">Play Again</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const input = document.getElementById('guess-input');
      const controls = document.getElementById('game-controls');

      function activateKeyboardState() {
        document.documentElement.classList.add('keyboard-open');
        if (controls) controls.classList.add('keyboard-active');
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
      }

      function deactivateKeyboardState() {
        document.documentElement.classList.remove('keyboard-open');
        if (controls) controls.classList.remove('keyboard-active');
        window.scrollTo(0, 0);
        document.body.scrollTop = 0;
      }

      function checkViewport() {
        if (!window.visualViewport) return;
        const isKeyboard = (window.innerHeight - window.visualViewport.height) > 120;
        if (isKeyboard || document.activeElement === input) {
          activateKeyboardState();
        } else {
          deactivateKeyboardState();
        }
      }

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', checkViewport);
        window.visualViewport.addEventListener('scroll', checkViewport);
      }

      if (input) {
        input.addEventListener('focus', function () {
          activateKeyboardState();
        });

        input.addEventListener('blur', function () {
          setTimeout(function () {
            if (document.activeElement !== input) {
              deactivateKeyboardState();
            }
          }, 200);
        });
      }

      window.addEventListener('scroll', function () {
        if (window.scrollY !== 0 || window.scrollX !== 0) {
          window.scrollTo(0, 0);
        }
      }, { passive: true });
    })();
  </script>
